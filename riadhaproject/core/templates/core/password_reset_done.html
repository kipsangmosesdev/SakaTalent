{% extends 'core/base.html' %}
{% block title %}Check Your Email - TalentRise{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-6 text-center shadow-xl sm:p-8">
    <h1 class="font-heading text-2xl font-extrabold uppercase text-slate-900">Check your email</h1>
    <p class="mt-3 text-sm leading-6 text-slate-600">If an account exists for that email and can reset its password, we’ve sent instructions. Check your inbox and spam folder.</p>
    <a href="{% url 'login' %}" class="mt-6 inline-block font-semibold text-athletics-blue hover:underline">Back to login</a>
  </div>
</div>
{% endblock %}
