{% extends 'core/base.html' %}
{% block title %}Reset Password - TalentRise{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-6 shadow-xl sm:p-8">
    <h1 class="font-heading text-2xl font-extrabold uppercase text-slate-900">Forgot your password?</h1>
    <p class="mt-2 text-sm text-slate-600">Enter the email address on your account and we’ll send a password reset link if an account matches.</p>
    <form method="post" class="django-form-wrapper mt-6 space-y-4">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="w-full rounded-lg bg-athletics-orange px-4 py-3 font-heading text-sm font-bold uppercase text-black">Send reset link</button>
    </form>
    <p class="mt-5 text-center text-sm"><a href="{% url 'login' %}" class="font-semibold text-athletics-blue hover:underline">Back to login</a></p>
  </div>
</div>
{% endblock %}
