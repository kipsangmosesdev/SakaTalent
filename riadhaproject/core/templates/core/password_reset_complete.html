{% extends 'core/base.html' %}
{% block title %}Password Updated - TalentRise{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-6 text-center shadow-xl sm:p-8">
    <h1 class="font-heading text-2xl font-extrabold uppercase text-slate-900">Password updated</h1>
    <p class="mt-3 text-sm text-slate-600">Your password has been changed. You can now sign in with your new password.</p>
    <a href="{% url 'login' %}" class="mt-6 inline-block rounded-lg bg-athletics-orange px-5 py-3 font-heading text-sm font-bold uppercase text-black">Go to login</a>
  </div>
</div>
{% endblock %}
